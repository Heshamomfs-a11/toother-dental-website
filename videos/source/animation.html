<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dental Implant Procedure – Animation Source</title>
<style>
  html, body { margin: 0; background: #0a1628; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   Toother Dental Supplies – "How a Dental Implant Is Placed"
   Deterministic canvas animation. renderFrame(t) draws the frame at
   time t (seconds). render.js drives this through headless Chromium
   and pipes the frames to ffmpeg. Open the file directly in a browser
   to preview it in real time.
   ===================================================================== */
const W = 1920, H = 1080;
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
const offCanvas = document.createElement('canvas'); offCanvas.width = W; offCanvas.height = H;
const offCtx = offCanvas.getContext('2d');

const C = {
  primary: '#0066cc', primaryDark: '#004d99', primaryLight: '#e8f4fd',
  accent: '#00a8e8', dark: '#0a1628', darkLight: '#1a2740',
  text: '#2d3748', textLight: '#64748b', light: '#f8fafc', white: '#ffffff',
  gum: '#f2a0a8', gumDark: '#d9757f', bone: '#f3e7cf', boneDark: '#d8c6a0',
  tooth: '#fbfbf7', toothShade: '#dcdcd0', titanium: '#b9c0c9', titaniumDark: '#7d8792',
  skin: '#f1c9a5', skinDark: '#d9a97f', hair: '#4a3728', scrubs: '#1f7ad1', scrubsDark: '#155ea6',
  green: '#22c55e'
};

// ---------- timeline (seconds) ----------
const SCENES = [
  { id: 'intro',   start: 0,  end: 5 },
  { id: 'step1',   start: 5,  end: 13 },
  { id: 'step2',   start: 13, end: 21 },
  { id: 'step3',   start: 21, end: 30 },
  { id: 'step4',   start: 30, end: 39 },
  { id: 'step5',   start: 39, end: 46 },
  { id: 'step6',   start: 46, end: 55 },
  { id: 'outro',   start: 55, end: 62 },
];
const DURATION = 62;
const XFADE = 0.6;
let uiAlpha = 1; // caption/chip fade for step-to-step transitions

const STEPS = {
  step1: { n: 1, title: 'Assessment & Planning',   sub: 'A digital scan maps the jaw and locates the missing tooth' },
  step2: { n: 2, title: 'Preparing the Site',      sub: 'A precise channel is drilled into the jawbone' },
  step3: { n: 3, title: 'Placing the Implant',     sub: 'A titanium implant is screwed into the bone' },
  step4: { n: 4, title: 'Healing',                 sub: 'Bone fuses to the implant over 3–6 months (osseointegration)' },
  step5: { n: 5, title: 'Attaching the Abutment',  sub: 'A connector is fitted to the integrated implant' },
  step6: { n: 6, title: 'Fitting the Crown',       sub: 'A custom crown completes the natural-looking tooth' },
};

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
// progress of t between a and b, clamped to [0,1]
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 500} ${size}px Inter, "Inter Display", Arial, sans-serif`;
  ctx.fillStyle = opts.color || C.text;
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'alphabetic';
  if (opts.alpha !== undefined) ctx.globalAlpha *= opts.alpha;
  ctx.fillText(str, x, y);
  ctx.restore();
}

// ---------- background ----------
function drawBackground(dark) {
  if (dark) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d1b33');
    g.addColorStop(1, C.dark);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const r1 = ctx.createRadialGradient(W * 0.5, 0, 0, W * 0.5, 0, 900);
    r1.addColorStop(0, 'rgba(0,102,204,0.35)');
    r1.addColorStop(1, 'rgba(0,102,204,0)');
    ctx.fillStyle = r1; ctx.fillRect(0, 0, W, H);
    const r2 = ctx.createRadialGradient(W * 0.85, H * 0.6, 0, W * 0.85, H * 0.6, 700);
    r2.addColorStop(0, 'rgba(0,168,232,0.18)');
    r2.addColorStop(1, 'rgba(0,168,232,0)');
    ctx.fillStyle = r2; ctx.fillRect(0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#eef5fc');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // dot grid
  ctx.fillStyle = dark ? 'rgba(255,255,255,0.035)' : 'rgba(0,102,204,0.06)';
  for (let y = 40; y < H; y += 80) for (let x = 40; x < W; x += 80) {
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- brand ----------
function drawLogoMark(x, y, s, onDark) {
  // tooth icon inside a rounded square
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createLinearGradient(-30, -30, 30, 30);
  g.addColorStop(0, C.primary); g.addColorStop(1, C.accent);
  ctx.fillStyle = g;
  roundRect(-32, -32, 64, 64, 16); ctx.fill();
  ctx.fillStyle = '#fff';
  drawToothShape(0, 4, 0.27);
  ctx.restore();
}

function drawBrand(x, y, s, onDark, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  drawLogoMark(x, y, s, onDark);
  text('Toother', x + 48 * s, y - 2 * s, 34 * s, { weight: 800, color: onDark ? '#fff' : C.dark, baseline: 'alphabetic' });
  text('DENTAL SUPPLIES', x + 48 * s, y + 24 * s, 14 * s, { weight: 600, color: onDark ? 'rgba(255,255,255,0.7)' : C.textLight });
  ctx.restore();
}

// ---------- anatomy ----------
// Generic molar silhouette (crown + two roots). Local coords, origin at crown centre.
function drawToothShape(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-60, -40);
  ctx.bezierCurveTo(-60, -90, -20, -95, 0, -75);
  ctx.bezierCurveTo(20, -95, 60, -90, 60, -40);
  ctx.bezierCurveTo(62, -5, 50, 10, 42, 30);
  ctx.bezierCurveTo(40, 80, 28, 110, 20, 110);
  ctx.bezierCurveTo(12, 110, 10, 60, 0, 40);
  ctx.bezierCurveTo(-10, 60, -12, 110, -20, 110);
  ctx.bezierCurveTo(-28, 110, -40, 80, -42, 30);
  ctx.bezierCurveTo(-50, 10, -62, -5, -60, -40);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCrownShape(x, y, s) {
  // crown only (no roots), flat base – sits on the abutment
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-60, -40);
  ctx.bezierCurveTo(-60, -90, -20, -95, 0, -75);
  ctx.bezierCurveTo(20, -95, 60, -90, 60, -40);
  ctx.bezierCurveTo(62, -5, 52, 20, 46, 40);
  ctx.lineTo(-46, 40);
  ctx.bezierCurveTo(-52, 20, -62, -5, -60, -40);
  ctx.closePath();
  ctx.restore();
}

function fillTooth(drawFn, x, y, s, shade = 1) {
  ctx.save();
  const g = ctx.createLinearGradient(x - 40 * s, y - 60 * s, x + 50 * s, y + 80 * s);
  g.addColorStop(0, C.tooth);
  g.addColorStop(1, C.toothShade);
  ctx.fillStyle = g;
  ctx.globalAlpha *= shade;
  if (drawFn === drawToothShape) {
    drawToothShape(x, y, s);
  } else {
    drawCrownShape(x, y, s); ctx.fill();
  }
  ctx.restore();
  // outline
  ctx.save();
  ctx.strokeStyle = 'rgba(80,80,70,0.35)'; ctx.lineWidth = 2;
  if (drawFn === drawToothShape) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(-60, -40);
    ctx.bezierCurveTo(-60, -90, -20, -95, 0, -75);
    ctx.bezierCurveTo(20, -95, 60, -90, 60, -40);
    ctx.bezierCurveTo(62, -5, 50, 10, 42, 30);
    ctx.bezierCurveTo(40, 80, 28, 110, 20, 110);
    ctx.bezierCurveTo(12, 110, 10, 60, 0, 40);
    ctx.bezierCurveTo(-10, 60, -12, 110, -20, 110);
    ctx.bezierCurveTo(-28, 110, -40, 80, -42, 30);
    ctx.bezierCurveTo(-50, 10, -62, -5, -60, -40);
    ctx.closePath();
    ctx.restore();
    ctx.stroke();
  } else {
    drawCrownShape(x, y, s); ctx.stroke();
  }
  ctx.restore();
}

// Implant screw. Origin = top centre of the implant body. len = body length.
function drawImplant(x, y, len, rot, alpha = 1) {
  const w = 46;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha *= alpha;
  // body (tapered)
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0);
  ctx.lineTo(w / 2, 0);
  ctx.lineTo(w / 2 - 6, len - 24);
  ctx.quadraticCurveTo(0, len + 12, -w / 2 + 6, len - 24);
  ctx.closePath();
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, C.titaniumDark);
  g.addColorStop(0.35, '#e3e8ee');
  g.addColorStop(0.6, C.titanium);
  g.addColorStop(1, C.titaniumDark);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.save();
  ctx.clip();
  // threads: slanted bands that scroll with rotation to read as "turning"
  const pitch = 16;
  const offset = ((rot / (Math.PI * 2)) * pitch) % pitch;
  ctx.strokeStyle = 'rgba(60,70,80,0.55)';
  ctx.lineWidth = 3;
  for (let yy = 20 - pitch + offset; yy < len; yy += pitch) {
    ctx.beginPath();
    ctx.moveTo(-w / 2 - 4, yy + 4);
    ctx.lineTo(w / 2 + 4, yy - 4);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1.5;
  for (let yy = 20 - pitch + offset + 3; yy < len; yy += pitch) {
    ctx.beginPath();
    ctx.moveTo(-w / 2 - 4, yy + 4);
    ctx.lineTo(w / 2 + 4, yy - 4);
    ctx.stroke();
  }
  ctx.restore();
  // collar / platform
  ctx.fillStyle = '#d5dae0';
  roundRect(-w / 2 - 2, -8, w + 4, 12, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(60,70,80,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  // internal hex
  ctx.fillStyle = '#5c6670';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = rot + i * Math.PI / 3;
    const px = Math.cos(a) * 9, py = -2 + Math.sin(a) * 4;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawAbutment(x, y, alpha = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha *= alpha;
  const g = ctx.createLinearGradient(-20, 0, 20, 0);
  g.addColorStop(0, C.titaniumDark); g.addColorStop(0.4, '#eef1f4'); g.addColorStop(1, C.titaniumDark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-23, 0);
  ctx.lineTo(23, 0);
  ctx.lineTo(16, -58);
  ctx.lineTo(-16, -58);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,70,80,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  // screw channel
  ctx.fillStyle = '#5c6670';
  roundRect(-5, -58, 10, 42, 4); ctx.fill();
  ctx.restore();
}

function drawHandpiece(x, y, angle, spinning, t, kind = 'drill') {
  // dental handpiece. tip at (x, y), pointing "down" along angle (radians from +y)
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  // shaft going up from tip
  const bodyLen = 170;
  const g = ctx.createLinearGradient(-14, 0, 14, 0);
  g.addColorStop(0, '#7f8a95'); g.addColorStop(0.4, '#eef1f4'); g.addColorStop(1, '#7f8a95');
  ctx.fillStyle = g;
  // head
  roundRect(-18, -34, 36, 34, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(40,50,60,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  // neck/body angled away
  ctx.save();
  ctx.translate(0, -30);
  ctx.rotate(-0.35);
  roundRect(-11, -bodyLen, 22, bodyLen, 10); ctx.fill(); ctx.stroke();
  // grip rings
  ctx.fillStyle = C.primary;
  for (let i = 0; i < 3; i++) { roundRect(-11, -bodyLen + 30 + i * 14, 22, 6, 3); ctx.fill(); }
  ctx.restore();
  if (kind === 'drill') {
    // burr: thin shaft with flutes that flicker while spinning
    ctx.fillStyle = '#8f99a3';
    ctx.fillRect(-3, 0, 6, 34);
    ctx.fillStyle = spinning ? (Math.floor(t * 40) % 2 ? '#aab3bc' : '#6a747e') : '#8f99a3';
    ctx.beginPath();
    ctx.moveTo(-5, 10); ctx.lineTo(5, 10); ctx.lineTo(4, 40); ctx.lineTo(0, 46); ctx.lineTo(-4, 40); ctx.closePath();
    ctx.fill();
  } else if (kind === 'driver') {
    ctx.fillStyle = '#8f99a3';
    ctx.fillRect(-4, 0, 8, 30);
    ctx.fillStyle = '#5c6670';
    ctx.fillRect(-7, 28, 14, 10);
  }
  ctx.restore();
}

// Water-spray droplets while drilling
function drawSpray(x, y, t, alpha) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.fillStyle = C.accent;
  for (let i = 0; i < 14; i++) {
    const ph = (t * 2.2 + i * 0.173) % 1;
    const a = -Math.PI / 2 + (i / 14 - 0.5) * 2.2;
    const r = 10 + ph * 70;
    ctx.globalAlpha = alpha * (1 - ph);
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.6 - ph * 10, 3 + (1 - ph) * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/*
  Jaw cross-section inside the magnifier. All geometry is in local
  coordinates (origin = centre of the magnifier). state:
    osteo      0..1  depth of the drilled channel
    implant    0..1  implant descent (1 = fully seated)
    implantRot radians
    implantAlpha
    integ      0..1  osseointegration
    abut       0..1  abutment descent (1 = seated)
    abutAlpha
    crown      0..1  crown descent
    crownAlpha
    scan       0..1  scanning sweep (step 1)
    lift       px   vertical offset for the "missing tooth" ghost
*/
function drawJawSection(cx, cy, R, st, t) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();

  // mouth cavity (top) – soft dark gradient
  const sky = ctx.createLinearGradient(0, -R, 0, 0);
  sky.addColorStop(0, '#2b1e2a'); sky.addColorStop(1, '#5b3a48');
  ctx.fillStyle = sky; ctx.fillRect(-R, -R, 2 * R, 2 * R);

  const gumTop = -20;      // top of gum line (y)
  const boneTop = 40;      // top of bone (y)
  const implantLen = 210;
  const seatY = boneTop - 6; // implant platform level when seated (slightly sub-crestal)

  // bone
  ctx.fillStyle = C.bone;
  ctx.fillRect(-R, boneTop, 2 * R, R - boneTop + 10);
  // cancellous speckle (deterministic)
  ctx.fillStyle = 'rgba(170,140,90,0.28)';
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 260; i++) {
    const px = -R + rnd() * 2 * R, py = boneTop + 24 + rnd() * (R - boneTop);
    const rr = 2 + rnd() * 5;
    ctx.beginPath(); ctx.ellipse(px, py, rr * 1.4, rr, rnd() * 3, 0, Math.PI * 2); ctx.fill();
  }
  // cortical bone band
  ctx.fillStyle = C.boneDark;
  ctx.fillRect(-R, boneTop, 2 * R, 14);

  // gum (wavy top edge)
  ctx.fillStyle = C.gum;
  ctx.beginPath();
  ctx.moveTo(-R, boneTop + 2);
  ctx.lineTo(-R, gumTop);
  for (let x = -R; x <= R; x += 4) {
    const y = gumTop + Math.sin((x + 200) / 60) * 6 + (Math.abs(x) < 90 ? 10 * (1 - Math.abs(x) / 90) : 0);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(R, boneTop + 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(-R, boneTop - 8, 2 * R, 10);

  // neighbouring teeth (roots in bone, crowns above gum)
  fillTooth(drawToothShape, -210, -45, 1.05);
  fillTooth(drawToothShape, 210, -45, 1.05);
  fillTooth(drawToothShape, -395, -45, 1.0);
  fillTooth(drawToothShape, 395, -45, 1.0);

  // ghost of the missing tooth (step 1)
  if (st.ghost > 0) {
    ctx.save();
    ctx.globalAlpha *= st.ghost * 0.55;
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3;
    ctx.save(); ctx.translate(0, -45 - (st.lift || 0)); ctx.scale(1.05, 1.05);
    ctx.beginPath();
    ctx.moveTo(-60, -40);
    ctx.bezierCurveTo(-60, -90, -20, -95, 0, -75);
    ctx.bezierCurveTo(20, -95, 60, -90, 60, -40);
    ctx.bezierCurveTo(62, -5, 50, 10, 42, 30);
    ctx.bezierCurveTo(40, 80, 28, 110, 20, 110);
    ctx.bezierCurveTo(12, 110, 10, 60, 0, 40);
    ctx.bezierCurveTo(-10, 60, -12, 110, -20, 110);
    ctx.bezierCurveTo(-28, 110, -40, 80, -42, 30);
    ctx.bezierCurveTo(-50, 10, -62, -5, -60, -40);
    ctx.closePath();
    ctx.restore();
    ctx.stroke();
    ctx.restore();
  }

  // osteotomy (drilled channel)
  if (st.osteo > 0) {
    const depth = st.osteo * (implantLen - 10);
    const w = 44;
    const chTop = gumTop - 6 + (st.gumClose || 0) * 18;
    ctx.fillStyle = '#6b4a3a';
    ctx.beginPath();
    ctx.moveTo(-w / 2, chTop);
    ctx.lineTo(w / 2, chTop);
    ctx.lineTo(w / 2 - 6, seatY + depth);
    ctx.quadraticCurveTo(0, seatY + depth + 14, -w / 2 + 6, seatY + depth);
    ctx.closePath(); ctx.fill();
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g; ctx.fill();
  }

  // integration glow (bone knitting onto the implant)
  if (st.integ > 0 && st.implantAlpha > 0) {
    ctx.save();
    const y0 = seatY;
    const grd = ctx.createLinearGradient(-60, y0, 60, y0);
    const a = 0.0 + 0.55 * st.integ;
    grd.addColorStop(0, 'rgba(216,198,160,0)');
    grd.addColorStop(0.5, `rgba(216,198,160,${a})`);
    grd.addColorStop(1, 'rgba(216,198,160,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(-60, y0 + 10, 120, implantLen);
    // new bone cells: small dots that appear progressively
    seed = 99;
    ctx.fillStyle = 'rgba(190,160,110,0.8)';
    const n = Math.floor(st.integ * 90);
    for (let i = 0; i < n; i++) {
      const side = rnd() < 0.5 ? -1 : 1;
      const px = side * (26 + rnd() * 22), py = y0 + 14 + rnd() * (implantLen - 10);
      ctx.beginPath(); ctx.arc(px, py, 2 + rnd() * 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // implant
  if (st.implantAlpha > 0) {
    const startY = -R + 40;
    const y = lerp(startY, seatY, st.implant);
    drawImplant(0, y, implantLen, st.implantRot || 0, st.implantAlpha);
    // soft tissue closes over the implant platform while it heals
    if (st.gumClose > 0) {
      ctx.save();
      ctx.globalAlpha *= st.gumClose;
      ctx.fillStyle = C.gum;
      ctx.beginPath();
      ctx.moveTo(-30, gumTop + 10);
      ctx.quadraticCurveTo(0, gumTop - 10, 30, gumTop + 10);
      ctx.lineTo(30, seatY + 4);
      ctx.lineTo(-30, seatY + 4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // abutment
    if (st.abutAlpha > 0) {
      const ay = lerp(-R + 30, seatY - 4, st.abut);
      drawAbutment(0, ay, st.abutAlpha);
    }
    // crown
    if (st.crownAlpha > 0) {
      const cy0 = lerp(-R + 10, seatY - 82, st.crown);
      ctx.save(); ctx.globalAlpha *= st.crownAlpha;
      // crown scaled to match neighbours
      ctx.save();
      const g = ctx.createLinearGradient(-40, cy0 - 60, 50, cy0 + 50);
      g.addColorStop(0, C.tooth); g.addColorStop(1, C.toothShade);
      ctx.fillStyle = g;
      drawCrownShape(0, cy0, 1.05); ctx.fill();
      ctx.strokeStyle = 'rgba(80,80,70,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
      ctx.restore();
    }
  }

  // scanning sweep (step 1)
  if (st.scan > 0) {
    const sy = -R + st.scan * 2 * R;
    const g = ctx.createLinearGradient(0, sy - 120, 0, sy);
    g.addColorStop(0, 'rgba(0,168,232,0)'); g.addColorStop(1, 'rgba(0,168,232,0.35)');
    ctx.fillStyle = g; ctx.fillRect(-R, sy - 120, 2 * R, 120);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-R, sy); ctx.lineTo(R, sy); ctx.stroke();
    // grid overlay
    ctx.strokeStyle = 'rgba(0,168,232,0.25)'; ctx.lineWidth = 1;
    for (let x = -R; x < R; x += 40) { ctx.beginPath(); ctx.moveTo(x, -R); ctx.lineTo(x, sy); ctx.stroke(); }
    for (let y = -R; y < sy; y += 40) { ctx.beginPath(); ctx.moveTo(-R, y); ctx.lineTo(R, y); ctx.stroke(); }
  }
  if (st.measure > 0) {
    // measurement callouts (bone height / width)
    ctx.save();
    ctx.globalAlpha *= st.measure;
    ctx.strokeStyle = C.accent; ctx.fillStyle = C.accent; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(70, boneTop + 4); ctx.lineTo(70, boneTop + implantLen + 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, boneTop + 4); ctx.lineTo(80, boneTop + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, boneTop + implantLen + 20); ctx.lineTo(80, boneTop + implantLen + 20); ctx.stroke();
    text('bone height', 84, boneTop + 120, 22, { weight: 600, color: C.accent });
    ctx.beginPath(); ctx.moveTo(-70, boneTop - 24); ctx.lineTo(70, boneTop - 24); ctx.stroke();
    text('implant site', 0, boneTop - 36, 22, { weight: 600, color: C.accent, align: 'center' });
    ctx.restore();
  }

  ctx.restore();

  // magnifier ring
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 14; ctx.stroke();
  ctx.strokeStyle = C.primary; ctx.lineWidth = 5; ctx.stroke();
  ctx.restore();
}

// ---------- clinic scene (dentist + patient) ----------
function drawClinic(ox, oy, s, pose, t) {
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(s, s);

  // floor shadow
  ctx.fillStyle = 'rgba(10,22,40,0.08)';
  ctx.beginPath(); ctx.ellipse(40, 300, 420, 46, 0, 0, Math.PI * 2); ctx.fill();

  // chair base
  ctx.fillStyle = '#9aa7b8';
  roundRect(-40, 240, 180, 50, 14); ctx.fill();
  ctx.fillStyle = '#6b7a8f';
  roundRect(20, 150, 60, 100, 10); ctx.fill();

  // chair (reclined) – seat + backrest + headrest
  const chairG = ctx.createLinearGradient(-300, 0, 300, 0);
  chairG.addColorStop(0, '#2d6fc9'); chairG.addColorStop(1, '#1f55a0');
  ctx.fillStyle = chairG;
  roundRect(-330, 120, 700, 60, 26); ctx.fill();         // seat/leg rest
  roundRect(-330, 70, 260, 70, 26); ctx.fill();          // backrest-ish
  // headrest
  ctx.fillStyle = '#244f8c';
  roundRect(-392, 60, 110, 70, 22); ctx.fill();

  // patient body under bib
  ctx.fillStyle = '#bfe3f5';
  roundRect(-250, 72, 560, 70, 28); ctx.fill();
  // patient legs
  ctx.fillStyle = '#5a6a80';
  roundRect(140, 90, 230, 48, 20); ctx.fill();
  // patient feet
  ctx.fillStyle = '#2d3748';
  roundRect(340, 92, 44, 48, 12); ctx.fill();
  // patient neck
  ctx.fillStyle = C.skin;
  roundRect(-262, 80, 50, 40, 14); ctx.fill();
  // patient head (reclined, facing up)
  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.ellipse(-325, 85, 58, 50, -0.25, 0, Math.PI * 2); ctx.fill();
  // hair
  ctx.fillStyle = C.hair;
  ctx.beginPath(); ctx.ellipse(-348, 86, 50, 46, -0.25, Math.PI * 0.6, Math.PI * 1.45); ctx.fill();
  // ear
  ctx.fillStyle = C.skinDark;
  ctx.beginPath(); ctx.ellipse(-330, 118, 10, 14, 0, 0, Math.PI * 2); ctx.fill();
  // eye (closed/relaxed)
  ctx.strokeStyle = '#3b2b20'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-350, 70, 9, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  // nose
  ctx.beginPath(); ctx.moveTo(-318, 52); ctx.lineTo(-308, 60); ctx.stroke();
  // open mouth
  ctx.fillStyle = '#5b3a48';
  ctx.beginPath(); ctx.ellipse(-290, 62, 16, 12, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-300, 54, 18, 5);

  // ---------- dentist ----------
  // position: standing behind the patient's head, leaning in. Origin ~ hips.
  ctx.save();
  ctx.translate(-470, 60);
  const lean = pose.lean || 0; // radians leaning toward patient
  ctx.rotate(lean);

  // legs / lower scrubs
  ctx.fillStyle = C.scrubsDark;
  roundRect(-60, 60, 120, 230, 30); ctx.fill();
  // torso
  const tg = ctx.createLinearGradient(-70, -160, 70, 60);
  tg.addColorStop(0, C.scrubs); tg.addColorStop(1, C.scrubsDark);
  ctx.fillStyle = tg;
  roundRect(-72, -160, 144, 240, 44); ctx.fill();
  // pocket + pen
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(10, -120, 42, 46, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(22, -132, 6, 30);

  // back arm (static, resting)
  ctx.strokeStyle = C.scrubs; ctx.lineWidth = 36; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-50, -120); ctx.lineTo(-20, -10); ctx.stroke();
  ctx.fillStyle = '#9ad3f0'; // glove
  ctx.beginPath(); ctx.arc(-14, 8, 22, 0, Math.PI * 2); ctx.fill();

  // head
  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.ellipse(0, -215, 52, 58, 0, 0, Math.PI * 2); ctx.fill();
  // cap
  ctx.fillStyle = C.primary;
  ctx.beginPath(); ctx.ellipse(0, -248, 56, 34, 0, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(-56, -250, 112, 10);
  // mask
  ctx.fillStyle = '#e8f4fd';
  roundRect(-44, -208, 88, 52, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-40, -190); ctx.lineTo(40, -190); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-40, -176); ctx.lineTo(40, -176); ctx.stroke();
  // mask straps
  ctx.strokeStyle = '#cfe6f7'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-44, -200); ctx.lineTo(-56, -226); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(44, -200); ctx.lineTo(56, -226); ctx.stroke();
  // eyes (looking down toward patient)
  ctx.fillStyle = '#2d3748';
  ctx.beginPath(); ctx.ellipse(-18, -226, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(18, -226, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
  // brows
  ctx.strokeStyle = '#4a3728'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-28, -240); ctx.lineTo(-8, -238); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, -238); ctx.lineTo(28, -240); ctx.stroke();
  // loupes glasses
  ctx.strokeStyle = '#1a2740'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(-18, -226, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(18, -226, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -226); ctx.lineTo(4, -226); ctx.stroke();

  // working arm – shoulder at (40,-130), elbow, hand holding instrument
  const armA = pose.armAngle !== undefined ? pose.armAngle : 0.9;   // from vertical
  const foreA = pose.foreAngle !== undefined ? pose.foreAngle : 0.2;
  const sx = 46, sy = -130;
  const ex = sx + Math.sin(armA) * 110, ey = sy + Math.cos(armA) * 110;
  const hx = ex + Math.sin(foreA) * 105, hy = ey + Math.cos(foreA) * 105;
  ctx.strokeStyle = C.scrubs; ctx.lineWidth = 36; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.lineWidth = 32;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  // glove
  ctx.fillStyle = '#9ad3f0';
  ctx.beginPath(); ctx.arc(hx, hy, 24, 0, Math.PI * 2); ctx.fill();
  // instrument in hand
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(-lean);
  if (pose.tool === 'handpiece') {
    ctx.save(); ctx.scale(0.75, 0.75); ctx.translate(0, 70);
    drawHandpiece(0, 0, pose.toolAngle || 0.4, pose.spinning, t, 'drill');
    ctx.restore();
  } else if (pose.tool === 'driver') {
    ctx.save(); ctx.scale(0.75, 0.75); ctx.translate(0, 70);
    drawHandpiece(0, 0, pose.toolAngle || 0.4, false, t, 'driver');
    ctx.restore();
  } else if (pose.tool === 'mirror') {
    ctx.strokeStyle = '#8f99a3'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(60, 50); ctx.stroke();
    ctx.fillStyle = '#dfe7ee'; ctx.beginPath(); ctx.arc(68, 56, 16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8f99a3'; ctx.lineWidth = 3; ctx.stroke();
  } else if (pose.tool === 'tweezers') {
    ctx.strokeStyle = '#8f99a3'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(60, 52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(64, 46); ctx.stroke();
  } else if (pose.tool === 'tablet') {
    ctx.fillStyle = '#1a2740'; roundRect(-10, -30, 120, 84, 10); ctx.fill();
    ctx.fillStyle = '#e8f4fd'; roundRect(-2, -22, 104, 68, 6); ctx.fill();
    // mini jaw scan on the tablet
    ctx.fillStyle = C.accent; ctx.globalAlpha = 0.8;
    for (let i = 0; i < 6; i++) { if (i === 3) continue; roundRect(6 + i * 16, 4, 12, 22, 3); ctx.fill(); }
    ctx.strokeStyle = C.accent; ctx.setLineDash([3, 3]); ctx.lineWidth = 2; roundRect(6 + 3 * 16, 4, 12, 22, 3); ctx.stroke();
  }
  ctx.restore();

  ctx.restore(); // dentist

  // overhead light arm
  ctx.strokeStyle = '#cfd6de'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-120, -330); ctx.lineTo(-230, -230); ctx.stroke();
  ctx.fillStyle = '#e6ebf0';
  ctx.beginPath(); ctx.ellipse(-250, -215, 60, 24, -0.6, 0, Math.PI * 2); ctx.fill();
  const lg = ctx.createRadialGradient(-250, -215, 10, -250, -215, 90);
  lg.addColorStop(0, 'rgba(255,255,255,0.9)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.ellipse(-250, -215, 60, 24, -0.6, 0, Math.PI * 2); ctx.fill();
  // light cone
  ctx.fillStyle = 'rgba(255,245,200,0.14)';
  ctx.beginPath(); ctx.moveTo(-290, -200); ctx.lineTo(-210, -230); ctx.lineTo(-240, 60); ctx.lineTo(-380, 60); ctx.closePath(); ctx.fill();

  ctx.restore();
}

// ---------- UI chrome ----------
function chip(x, y, label, color, size = 20) {
  ctx.save();
  ctx.globalAlpha *= uiAlpha;
  ctx.font = `600 ${size}px Inter, "Inter Display", Arial, sans-serif`;
  const w = ctx.measureText(label).width + 48;
  ctx.fillStyle = color;
  roundRect(x - w / 2, y - 23, w, 46, 23); ctx.fill();
  text(label, x, y + 8, size, { weight: 600, color: '#fff', align: 'center' });
  ctx.restore();
}

function drawStepPills(active, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha;
  const n = 6, w = 150, gap = 14, total = n * w + (n - 1) * gap;
  const x0 = W / 2 - total / 2, y = 56;
  for (let i = 1; i <= n; i++) {
    const x = x0 + (i - 1) * (w + gap);
    const done = i < active, cur = i === active;
    ctx.fillStyle = cur ? C.primary : done ? C.green : 'rgba(10,22,40,0.08)';
    roundRect(x, y, w, 34, 17); ctx.fill();
    text(done ? '✓ Step ' + i : 'Step ' + i, x + w / 2, y + 23, 17, { weight: 600, color: cur || done ? '#fff' : C.textLight, align: 'center' });
  }
  ctx.restore();
}

function drawCaption(step, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha * uiAlpha;
  const y = 920;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,102,204,0.15)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  roundRect(140, y - 60, W - 280, 120, 24); ctx.fill();
  ctx.shadowColor = 'transparent';
  // step badge
  const bg = ctx.createLinearGradient(170, y - 36, 240, y + 36);
  bg.addColorStop(0, C.primary); bg.addColorStop(1, C.accent);
  ctx.fillStyle = bg;
  roundRect(170, y - 36, 72, 72, 18); ctx.fill();
  text(String(step.n), 206, y + 15, 40, { weight: 800, color: '#fff', align: 'center' });
  text(step.title, 268, y - 2, 36, { weight: 700, color: C.dark });
  text(step.sub, 268, y + 38, 24, { weight: 400, color: C.textLight });
  ctx.restore();
}

function drawZoomLink(alpha) {
  // dashed line from the patient's mouth to the magnifier
  ctx.save(); ctx.globalAlpha *= alpha * 0.8;
  ctx.setLineDash([10, 10]); ctx.strokeStyle = C.primary; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(392, 592); ctx.lineTo(1000, 520); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = C.primary;
  ctx.beginPath(); ctx.arc(392, 592, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.primary; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(392, 592, 20, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// shared procedure frame
function procedureFrame(stepId, lt, alpha, pose, jaw, t, extra) {
  drawBackground(false);
  ctx.save(); ctx.globalAlpha = alpha;
  drawBrand(60, 70, 0.95, false, 1);
  drawStepPills(STEPS[stepId].n, 1);
  drawClinic(CLINIC.x, CLINIC.y, CLINIC.s, pose, t);
  drawZoomLink(1);
  drawJawSection(MAG.x, MAG.y, MAG.R, jaw, t);
  if (extra) extra();
  drawCaption(STEPS[stepId], 1);
  ctx.restore();
}

function sceneStep1(lt, alpha, t) {
  const pose = { tool: 'tablet', armAngle: 0.5, foreAngle: -0.9, lean: 0.03 + Math.sin(t * 0.8) * 0.01 };
  const scan = lt < 4 ? P(lt, 0.6, 3.6) : 0;
  const jaw = { ghost: easeOut(P(lt, 0.2, 1.2)), lift: 0, scan: scan, measure: easeOut(P(lt, 3.8, 4.8)) };
  procedureFrame('step1', lt, alpha, pose, jaw, t, () => {
    // "3D scan" label inside the magnifier
    const a = scan > 0 ? 1 : easeOut(P(lt, 3.8, 4.6));
    ctx.save(); ctx.globalAlpha *= a;
    chip(MAG.x, MAG.y - MAG.R - 7, scan > 0 ? 'Scanning…' : 'Treatment plan ready', C.primary);
    ctx.restore();
  });
}

function sceneStep2(lt, alpha, t) {
  const press = easeInOut(P(lt, 1.0, 5.5));
  const vib = lt > 1.0 && lt < 5.5 ? Math.sin(t * 60) * 1.5 : 0;
  const pose = { tool: 'handpiece', armAngle: 1.72, foreAngle: 0.22 + press * 0.06 + vib * 0.01, toolAngle: 0.5, spinning: lt > 0.8 && lt < 5.7, lean: 0.04 };
  const jaw = { osteo: press };
  procedureFrame('step2', lt, alpha, pose, jaw, t, () => {
    // the handpiece in the magnifier, drilling down
    const drillY = MAG.y - 20 + press * 170 + vib;
    const spinning = lt > 0.8 && lt < 5.7;
    ctx.save();
    ctx.beginPath(); ctx.arc(MAG.x, MAG.y, MAG.R, 0, Math.PI * 2); ctx.clip();
    drawHandpiece(MAG.x, drillY - 36, 0, spinning, t, 'drill');
    if (spinning) drawSpray(MAG.x, drillY, t, 0.9);
    ctx.restore();
    // rpm chip
    ctx.save();
    ctx.globalAlpha *= spinning ? 1 : 0.4;
    chip(MAG.x, MAG.y - MAG.R - 7, spinning ? 'Low-speed, saline-cooled drilling' : press >= 1 ? 'Site prepared' : 'Pilot drill', spinning ? C.primary : press >= 1 ? C.green : C.textLight);
    ctx.restore();
  });
}

function sceneStep3(lt, alpha, t) {
  const appear = easeOut(P(lt, 0.2, 0.9));
  const seat = easeInOut(P(lt, 1.2, 6.2));
  const turning = lt > 1.2 && lt < 6.2;
  const rot = turning ? (lt - 1.2) * 7 : lt >= 6.2 ? 5 * 7 : 0;
  const pose = { tool: 'driver', armAngle: 1.72, foreAngle: 0.22 + seat * 0.06 + (turning ? Math.sin(t * 9) * 0.02 : 0), toolAngle: 0.5, lean: 0.04 };
  const jaw = { osteo: 1, implant: seat, implantRot: rot, implantAlpha: appear };
  procedureFrame('step3', lt, alpha, pose, jaw, t, () => {
    // driver attached to the implant head while turning
    if (appear > 0 && lt < 7) {
      const implantTop = MAG.y + lerp(-MAG.R + 40, 34, seat);
      ctx.save();
      ctx.beginPath(); ctx.arc(MAG.x, MAG.y, MAG.R, 0, Math.PI * 2); ctx.clip();
      ctx.globalAlpha *= appear * (1 - easeIn(P(lt, 6.2, 7)));
      drawHandpiece(MAG.x, implantTop - 10, 0, false, t, 'driver');
      // rotation arrows
      if (turning) {
        ctx.strokeStyle = C.accent; ctx.lineWidth = 4; ctx.lineCap = 'round';
        const a0 = (t * 5) % (Math.PI * 2);
        ctx.beginPath(); ctx.arc(MAG.x, implantTop - 20, 60, a0, a0 + 1.6); ctx.stroke();
        ctx.beginPath(); ctx.arc(MAG.x, implantTop - 20, 60, a0 + Math.PI, a0 + Math.PI + 1.6); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    chip(MAG.x, MAG.y - MAG.R - 7, turning ? 'Titanium implant · torqued into bone' : seat >= 1 ? 'Implant seated' : 'Titanium implant', turning ? C.primary : seat >= 1 ? C.green : C.textLight);
    ctx.restore();
  });
}

function sceneStep4(lt, alpha, t) {
  const heal = easeInOut(P(lt, 0.8, 7.5));
  const pose = { tool: 'mirror', armAngle: 0.6, foreAngle: -0.3, lean: 0.0 + Math.sin(t * 0.8) * 0.01 };
  const jaw = { osteo: 1, implant: 1, implantRot: 35, implantAlpha: 1, integ: heal, gumClose: easeOut(P(lt, 0.6, 2.0)) };
  procedureFrame('step4', lt, alpha, pose, jaw, t, () => {
    // month counter + progress ring at the top of the magnifier
    const months = 1 + Math.floor(heal * 5.999);
    ctx.save(); ctx.globalAlpha *= uiAlpha;
    const rx = MAG.x, ry = MAG.y - MAG.R - 8;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(rx, ry, 56, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,102,204,0.12)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(rx, ry, 48, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = C.primary; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(rx, ry, 48, -Math.PI / 2, -Math.PI / 2 + heal * Math.PI * 2); ctx.stroke();
    text('Month', rx, ry - 6, 16, { weight: 500, color: C.textLight, align: 'center' });
    text(String(months), rx, ry + 24, 30, { weight: 800, color: C.dark, align: 'center' });
    ctx.restore();
    // side note
    ctx.save(); ctx.globalAlpha *= easeOut(P(lt, 1.5, 2.5)) * uiAlpha;
    ctx.fillStyle = '#fff'; roundRect(MAG.x + MAG.R - 120, MAG.y + 150, 330, 92, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(0,102,204,0.15)'; ctx.lineWidth = 2; ctx.stroke();
    text('Osseointegration', MAG.x + MAG.R - 96, MAG.y + 188, 22, { weight: 700, color: C.dark });
    text('New bone grows onto the implant surface', MAG.x + MAG.R - 96, MAG.y + 220, 17, { weight: 400, color: C.textLight });
    ctx.restore();
  });
}

function sceneStep5(lt, alpha, t) {
  const appear = easeOut(P(lt, 0.3, 1.0));
  const seat = easeInOut(P(lt, 1.2, 4.2));
  const pose = { tool: 'tweezers', armAngle: 1.6, foreAngle: 0.1 + seat * 0.12, lean: 0.04 };
  const jaw = { osteo: 1, implant: 1, implantRot: 35, implantAlpha: 1, integ: 1, gumClose: 1, abut: seat, abutAlpha: appear };
  procedureFrame('step5', lt, alpha, pose, jaw, t, () => {
    ctx.save();
    chip(MAG.x, MAG.y - MAG.R - 7, seat >= 1 ? 'Abutment secured' : 'Fitting the abutment', seat >= 1 ? C.green : C.primary);
    ctx.restore();
    if (seat >= 1) {
      // torque tick
      const a = easeOut(P(lt, 4.3, 5.0));
      ctx.save(); ctx.globalAlpha *= a;
      ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(MAG.x + 90, MAG.y - 10, 22, 0, Math.PI * 2); ctx.fill();
      text('✓', MAG.x + 90, MAG.y - 2, 24, { weight: 800, color: '#fff', align: 'center' });
      ctx.restore();
    }
  });
}

function sceneStep6(lt, alpha, t) {
  const appear = easeOut(P(lt, 0.3, 1.0));
  const seat = easeInOut(P(lt, 1.2, 4.5));
  const pose = { tool: 'tweezers', armAngle: 1.6, foreAngle: 0.1 + seat * 0.12, lean: 0.04 };
  const jaw = { osteo: 1, implant: 1, implantRot: 35, implantAlpha: 1, integ: 1, gumClose: 1, abut: 1, abutAlpha: 1, crown: seat, crownAlpha: appear };
  procedureFrame('step6', lt, alpha, pose, jaw, t, () => {
    ctx.save();
    chip(MAG.x, MAG.y - MAG.R - 7, seat >= 1 ? 'Restoration complete' : 'Custom ceramic crown', seat >= 1 ? C.green : C.primary);
    ctx.restore();
    if (seat >= 1) {
      // sparkle
      const sp = ((lt - 4.5) * 1.2) % 1;
      ctx.save();
      ctx.beginPath(); ctx.arc(MAG.x, MAG.y, MAG.R, 0, Math.PI * 2); ctx.clip();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.globalAlpha *= 0.4 + 0.6 * Math.sin(sp * Math.PI);
      const sr = 12 + 8 * Math.sin(sp * Math.PI);
      const sx = MAG.x + 44, sy = MAG.y - 110;
      ctx.beginPath(); ctx.moveTo(sx, sy - sr); ctx.lineTo(sx, sy + sr); ctx.moveTo(sx - sr, sy); ctx.lineTo(sx + sr, sy); ctx.stroke();
      ctx.restore();
      // bite check label
      const a = easeOut(P(lt, 5, 6));
      ctx.save(); ctx.globalAlpha *= a * uiAlpha;
      ctx.fillStyle = '#fff'; roundRect(MAG.x + MAG.R - 120, MAG.y + 150, 330, 92, 18); ctx.fill();
      ctx.strokeStyle = 'rgba(0,102,204,0.15)'; ctx.lineWidth = 2; ctx.stroke();
      text('Bite & fit checked', MAG.x + MAG.R - 96, MAG.y + 188, 22, { weight: 700, color: C.dark });
      text('Looks, feels and works like a natural tooth', MAG.x + MAG.R - 96, MAG.y + 220, 17, { weight: 400, color: C.textLight });
      ctx.restore();
    }
  });
}

const RENDERERS = {
  intro: sceneIntro, outro: sceneOutro,
  step1: sceneStep1, step2: sceneStep2, step3: sceneStep3,
  step4: sceneStep4, step5: sceneStep5, step6: sceneStep6,
};

// ---------- master ----------
function renderScene(id, lt, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  RENDERERS[id](lt, 1, t);
}

function renderFrame(t) {
  const main = canvas.getContext('2d');
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalAlpha = 1;
  main.clearRect(0, 0, W, H);
  t = clamp(t, 0, DURATION - 1 / 60);
  for (let i = 0; i < SCENES.length; i++) {
    const s = SCENES[i];
    if (t >= s.start && t < s.end) {
      const lt = t - s.start;
      const dur = s.end - s.start;
      const isStep = s.id.startsWith('step');
      const prevIsStep = i > 0 && SCENES[i - 1].id.startsWith('step');
      const nextIsStep = i + 1 < SCENES.length && SCENES[i + 1].id.startsWith('step');
      uiAlpha = 1;
      if (isStep) {
        if (prevIsStep) uiAlpha = Math.min(uiAlpha, easeOut(P(lt, 0.05, 0.45)));
        if (nextIsStep) uiAlpha = Math.min(uiAlpha, 1 - easeIn(P(lt, dur - 0.3, dur)));
      }
      ctx = main;
      renderScene(s.id, lt, t);
      // cross-fade (only into/out of the dark title cards): previous scene keeps playing past its end and fades out on top
      if (i > 0 && lt < XFADE && !(isStep && prevIsStep)) {
        uiAlpha = 1;
        const prev = SCENES[i - 1];
        ctx = offCtx;
        renderScene(prev.id, prev.end - prev.start + lt, t);
        ctx = main;
        main.globalAlpha = 1 - easeInOut(lt / XFADE);
        main.drawImage(offCanvas, 0, 0);
        main.globalAlpha = 1;
      }
      break;
    }
  }
}

window.renderFrame = renderFrame;
window.VIDEO_DURATION = DURATION;

// Live preview when opened in a browser (not under the renderer)
if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() {
    const t = ((performance.now() - t0) / 1000) % DURATION;
    renderFrame(t);
    requestAnimationFrame(loop);
  })();
}
</script>
